    margin: 0 auto;

  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .subtitle { color: var(--text-secondary); font-size: 0.95rem; margin: 0 0 4px; }

  .header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }

  .live-status {

  }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .live-dot.on { background: var(--good); }
  .live-dot.off { background: var(--text-muted); }
  .live-dot.warn { background: var(--warning); }
  .live-dot.err { background: var(--critical); }
  .live-status button {
    border: 1px solid var(--border); background: transparent; color: var(--text-primary);
    border-radius: 999px; padding: 4px 12px; font-size: 0.78rem; cursor: pointer;
  }
  .live-status button:hover { background: var(--chip-bg); }

  .banner {
    font-size: 0.85rem; border-radius: 8px; padding: 10px 14px; margin: 14px 0;
    border: 1px solid var(--border);
  }
  .banner.info { color: var(--text-secondary); background: var(--surface-1); }
  .banner.warn { color: var(--text-primary); background: var(--surface-1); border-color: var(--warning); }
  .banner.err { color: var(--text-primary); background: var(--surface-1); border-color: var(--critical); }
  .banner[hidden] { display: none; }

  .caveat {
    color: var(--text-secondary);
    font-size: 0.85rem;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    margin: 16px 0 20px;
  }
  .caveat b { color: var(--text-primary); }

  /* ---- Filters ---- */
  .filter-bar {
    display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; margin: 0 0 6px;
  }
  .filter-group { display: flex; flex-direction: column; gap: 6px; }
  .filter-group > label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); }
  .filter-bar select, .filter-bar input[type="datetime-local"] {
    font-family: inherit; font-size: 0.85rem; color: var(--text-primary);
    background: var(--page); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px;
  }
  .chip-group { display: flex; flex-wrap: wrap; gap: 6px; max-width: 420px; }
  .chip {
    font-family: inherit; font-size: 0.78rem; border: 1px solid var(--border); background: var(--chip-bg);
    color: var(--text-secondary); border-radius: 999px; padding: 4px 12px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--chip-bg-active); color: var(--chip-text-active); border-color: transparent; }
  .filter-note { font-size: 0.78rem; color: var(--text-muted); margin: 6px 0 22px; }

  .content-wrap { transition: opacity 0.2s ease; }
  .content-wrap.stale { opacity: 0.55; }

  .stat-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 28px;
  }
  .stat-tile {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    min-width: 140px;
    flex: 1 1 160px;
  }
  .stat-tile .label { font-size: 0.75rem; color: var(--text-secondary); }
  .stat-tile .value { font-size: 1.4rem; font-weight: 600; margin-top: 2px; }

  .legend {
    display: flex;
    gap: 20px;
    align-items: center;
    margin: 4px 0 16px;
    font-size: 0.85rem;
    color: var(--text-secondary);
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 16px; height: 2px; border-radius: 2px; display: inline-block; }

  .chart-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 32px;
  }

    .chart-grid { grid-template-columns: 1fr; }
  }
  .chart-card {
    background: var(--surface-1);

    border-radius: 12px;
    padding: 14px 14px 8px;
    overflow-x: auto;
  }

  svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .axis-text { fill: var(--text-muted); font-size: 10px; }
  .end-label { fill: var(--text-primary); font-size: 11px; font-weight: 600; }
  .crosshair { stroke: var(--axis); stroke-width: 1; pointer-events: none; }
  .hit-rect { fill: transparent; }

  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.78rem;
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    display: none;
    white-space: nowrap;
    z-index: 10;
  }

  .tooltip .t-key { width: 10px; height: 2px; display: inline-block; }
  .tooltip .t-val { font-weight: 700; color: var(--text-primary); }
  .tooltip .t-name { color: var(--text-secondary); }

  h2.section { font-size: 1.1rem; margin: 8px 0 12px; }

  .bar-chart-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 32px;
    overflow-x: auto;

    padding: 12px 16px;

  .scroll-wrap { max-width: 100%; overflow-x: auto; }

function cssVar(name) {
  return getComputedStyle(document.querySelector('.viz-root')).getPropertyValue(name).trim();
}

function fmtMoney(v) {
  return v === null || v === undefined ? "s/d" : "$" + Math.round(v).toLocaleString('es-AR');
}

function relTime(ms) {
  if (ms === null) return "";
  const diff = Date.now() - ms;
  if (diff < 45000) return "hace instantes";
  const m = Math.round(diff / 60000);
  if (m < 60) return `hace ${m} min`;
  const h = Math.round(m / 60);
  if (h < 48) return `hace ${h} h`;
  return `hace ${Math.round(h/24)} d`;
}

function getAllRoutes() {
  const seen = new Map();
  RAW.forEach(d => { if (!seen.has(d.ruta)) seen.set(d.ruta, true); });
  const known = KNOWN_ROUTE_ORDER.filter(k => seen.has(k));
  const unknown = [...seen.keys()].filter(k => !KNOWN_ROUTE_ORDER.includes(k)).sort();
  return known.concat(unknown);
}

// ============================================================
// CSV parsing (RFC4180-ish: quoted fields, embedded commas, "" escaping)
// ============================================================
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i+1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\r') { /* skip */ }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r.length === 1 && r[0] !== ""));
}

function parseNum(s) {
  if (s === undefined || s === null || s.trim() === "") return null;
  const n = parseFloat(s.replace(",", "."));
  return isNaN(n) ? null : n;
}

function parseFecha(s) {
  // dd/mm/yyyy HH:MM:SS
  const m = s.trim().match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2}):(\d{2})/);
  if (!m) return null;
  const [, d, mo, y, h, mi, se] = m;
  return new Date(+y, +mo - 1, +d, +h, +mi, +se);
}

function csvToRecords(text) {
  const rows = parseCSV(text);
  if (!rows.length) return [];
  const header = rows[0].map(h => h.trim());
  const idx = {};
  header.forEach((h, i) => idx[h] = i);
  const out = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const fecha = parseFecha(r[idx["Fecha"]] || "");
    if (!fecha) continue;
    const origen = (r[idx["Origen"]] || "").trim();
    const destino = (r[idx["Destino"]] || "").trim();
    const rutaKey = ROUTE_TUPLES[origen + "|" + destino] || `${origen} -> ${destino}`;
    out.push({
      t: fecha,
      ruta: rutaKey,
      cabify: parseNum(r[idx["Precio Cabify"]]),
      uber: parseNum(r[idx["Precio Uber"]]),
      didi: parseNum(r[idx["Precio DiDi"]]),
    });
  }
  return out;
}

// ============================================================
// Filtering
// ============================================================
function inHourRange(hour, min, max) {
  if (min <= max) return hour >= min && hour <= max;
  return hour >= min || hour <= max; // wraps past midnight
}

function getFiltered() {
  let from = null, to = null;
  const maxT = RAW.length ? Math.max(...RAW.map(d => d.t.getTime())) : Date.now();
  if (filters.preset === "24h") from = maxT - 24*3600*1000;
  else if (filters.preset === "48h") from = maxT - 48*3600*1000;
  else if (filters.preset === "7d") from = maxT - 7*24*3600*1000;
  else if (filters.preset === "custom") {
    from = filters.customFrom ? new Date(filters.customFrom).getTime() : null;
    to = filters.customTo ? new Date(filters.customTo).getTime() : null;
  }

  return RAW.filter(d => {
    const tt = d.t.getTime();
    if (from !== null && tt < from) return false;
    if (to !== null && tt > to) return false;
    if (filters.routesMode !== "all" && !filters.routesMode.has(d.ruta)) return false;
    if (!inHourRange(d.t.getHours(), filters.hourMin, filters.hourMax)) return false;
    if (!filters.dow.has(d.t.getDay())) return false;
    return true;
  });
}

function buildFilterBar() {
  const presetSel = document.getElementById('f-preset');
  presetSel.value = filters.preset;
  presetSel.addEventListener('change', () => {
    filters.preset = presetSel.value;
    document.getElementById('f-custom-range').style.display = filters.preset === "custom" ? "flex" : "none";
    renderAll();
  });

  const fromInput = document.getElementById('f-from');
  const toInput = document.getElementById('f-to');
  fromInput.addEventListener('change', () => { filters.customFrom = fromInput.value || null; renderAll(); });
  toInput.addEventListener('change', () => { filters.customTo = toInput.value || null; renderAll(); });

  const hourMinSel = document.getElementById('f-hour-min');
  const hourMaxSel = document.getElementById('f-hour-max');
  for (let h = 0; h < 24; h++) {
    const o1 = document.createElement('option'); o1.value = h; o1.textContent = String(h).padStart(2,'0') + ":00";
    hourMinSel.appendChild(o1);
    const o2 = document.createElement('option'); o2.value = h; o2.textContent = String(h).padStart(2,'0') + ":00";
    hourMaxSel.appendChild(o2);
  }
  hourMinSel.value = filters.hourMin;
  hourMaxSel.value = filters.hourMax;
  hourMinSel.addEventListener('change', () => { filters.hourMin = +hourMinSel.value; renderAll(); });
  hourMaxSel.addEventListener('change', () => { filters.hourMax = +hourMaxSel.value; renderAll(); });

  const dowContainer = document.getElementById('f-dow');
  dowContainer.innerHTML = "";
  DOW_LABELS.forEach((label, i) => {
    const btn = document.createElement('button');
    btn.type = "button"; btn.className = "chip"; btn.textContent = label;
    btn.setAttribute('aria-pressed', filters.dow.has(i) ? 'true' : 'false');
    btn.addEventListener('click', () => {
      if (filters.dow.has(i)) filters.dow.delete(i); else filters.dow.add(i);
      btn.setAttribute('aria-pressed', filters.dow.has(i) ? 'true' : 'false');
      renderAll();
    });
    dowContainer.appendChild(btn);
  });
}

function buildRouteChips() {
  const container = document.getElementById('f-routes');
  container.innerHTML = "";
  const routes = getAllRoutes();
  const activeSet = filters.routesMode === "all" ? new Set(routes) : filters.routesMode;
  routes.forEach(key => {
    const btn = document.createElement('button');
    btn.type = "button"; btn.className = "chip"; btn.textContent = routeMeta(key).short;
    btn.setAttribute('aria-pressed', activeSet.has(key) ? 'true' : 'false');
    btn.addEventListener('click', () => {
      const current = filters.routesMode === "all" ? new Set(routes) : new Set(filters.routesMode);
      if (current.has(key)) current.delete(key); else current.add(key);
      filters.routesMode = current.size === routes.length ? "all" : current;
      buildRouteChips();
      renderAll();
    });
    container.appendChild(btn);
  });
}

function updateFilterNote() {
  const days = new Set(RAW.map(d => d.t.toDateString())).size;
  const note = document.getElementById('filter-note');
  if (days <= 2) {
    note.textContent = "Con menos de 2-3 días de datos acumulados, los filtros de rango de fechas y día de semana todavía no muestran diferencias reales — quedan listos para cuando haya más historia.";
  } else {
    note.textContent = "";
  }
}

function renderStats(data) {
  const total = data.length;
  const cabifyOk = data.filter(d => d.cabify !== null).length;
  const uberOk = data.filter(d => d.uber !== null).length;
  const didiOk = data.filter(d => d.didi !== null).length;
  const tiles = [
    {label: "Cotizaciones (filtro actual)", value: total.toLocaleString('es-AR')},
    {label: "Rutas visibles", value: new Set(data.map(d => d.ruta)).size},
    {label: "Disponibilidad Cabify", value: total ? Math.round(cabifyOk/total*100) + "%" : "—"},
    {label: "Disponibilidad Uber", value: total ? Math.round(uberOk/total*100) + "%" : "—"},
    {label: "Disponibilidad DiDi", value: total ? Math.round(didiOk/total*100) + "%" : "—"},
  ];
  const row = document.getElementById('stat-row');
  row.innerHTML = "";
  tiles.forEach(t => {
    const el = document.createElement('div');
    el.className = 'stat-tile';
    const l = document.createElement('div'); l.className = 'label'; l.textContent = t.label;
    const v = document.createElement('div'); v.className = 'value'; v.textContent = t.value;
    el.appendChild(l); el.appendChild(v);
    row.appendChild(el);
  });
}

function renderLegend(data) {
  const legend = document.getElementById('legend');
  legend.innerHTML = "";
  const series = [["Cabify", "var(--series-cabify)"], ["Uber", "var(--series-uber)"]];
  if (data.some(d => d.didi !== null)) series.push(["DiDi", "var(--series-didi)"]);
  series.forEach(([name, colorVar]) => {
    const item = document.createElement('span'); item.className = 'legend-item';
    const sw = document.createElement('span'); sw.className = 'legend-swatch'; sw.style.background = colorVar;
    item.appendChild(sw); item.appendChild(document.createTextNode(name));
    legend.appendChild(item);
  });
}

// ============================================================
// Line charts (small multiples)
// ============================================================
const CW = 480, CH = 220, PAD = {top: 10, right: 44, bottom: 22, left: 44};
const SERIES_DEFS = [
  {key: "cabify", name: "Cabify", colorVar: "var(--series-cabify)"},
  {key: "uber", name: "Uber", colorVar: "var(--series-uber)"},
  {key: "didi", name: "DiDi", colorVar: "var(--series-didi)"},
];

function buildLineChart(routeKey, data) {
  const pts = data.filter(d => d.ruta === routeKey).slice().sort((a,b) => a.t - b.t);
  const container = document.createElement('div');
  if (!pts.length) {
    const empty = document.createElement('p');
    empty.className = 'empty-note';
    empty.textContent = 'Sin datos con los filtros actuales.';
    container.appendChild(empty);
    return container;
  }

  const activeSeries = SERIES_DEFS.filter(s => pts.some(p => p[s.key] !== null));
  const tMin = pts[0].t.getTime(), tMax = pts[pts.length-1].t.getTime();
  const vals = [];
  pts.forEach(p => activeSeries.forEach(s => { if (p[s.key] !== null) vals.push(p[s.key]); }));
  const vMin = 0, vMax = (vals.length ? Math.max(...vals) : 1) * 1.08;
  const tSpan = Math.max(tMax - tMin, 1);

  const x = t => PAD.left + (t - tMin) / tSpan * (CW - PAD.left - PAD.right);
  const y = v => CH - PAD.bottom - (v - vMin) / (vMax - vMin || 1) * (CH - PAD.top - PAD.bottom);

  function pathFor(key) {
    let d = "", drawing = false;
    pts.forEach(p => {
      if (p[key] === null) { drawing = false; return; }
      d += `${drawing ? "L" : "M"}${x(p.t.getTime()).toFixed(1)},${y(p[key]).toFixed(1)} `;
      drawing = true;
    });
    return d.trim();
  }

  const gridVals = [0, vMax*0.5, vMax].map(v => Math.round(v/100)*100);
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("viewBox", `0 0 ${CW} ${CH}`);
  svg.setAttribute("class", "chart");
  svg.setAttribute("role", "img");

  gridVals.forEach(v => {
    const gy = y(v);
    const line = document.createElementNS(svgNS, "line");
    line.setAttribute("class", "gridline");
    line.setAttribute("x1", PAD.left); line.setAttribute("x2", CW - PAD.right);
    line.setAttribute("y1", gy); line.setAttribute("y2", gy);
    svg.appendChild(line);
    const text = document.createElementNS(svgNS, "text");
    text.setAttribute("class", "axis-text");
    text.setAttribute("x", PAD.left - 6); text.setAttribute("y", gy + 3);
    text.setAttribute("text-anchor", "end");
    text.textContent = "$" + v.toLocaleString('es-AR');
    svg.appendChild(text);
  });

  [pts[0], pts[Math.floor(pts.length/2)], pts[pts.length-1]].forEach(p => {
    const tx = x(p.t.getTime());
    const text = document.createElementNS(svgNS, "text");
    text.setAttribute("class", "axis-text");
    text.setAttribute("x", tx); text.setAttribute("y", CH - 4);
    text.setAttribute("text-anchor", "middle");
    text.textContent = p.t.toLocaleString('es-AR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
    svg.appendChild(text);
  });

  activeSeries.forEach(s => {
    const path = document.createElementNS(svgNS, "path");
    path.setAttribute("d", pathFor(s.key));
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", s.colorVar);
    path.setAttribute("stroke-width", "2");
    path.setAttribute("stroke-linecap", "round");
    path.setAttribute("stroke-linejoin", "round");
    svg.appendChild(path);

    for (let i = pts.length - 1; i >= 0; i--) {
      if (pts[i][s.key] !== null) {
        const dot = document.createElementNS(svgNS, "circle");
        dot.setAttribute("cx", x(pts[i].t.getTime())); dot.setAttribute("cy", y(pts[i][s.key])); dot.setAttribute("r", 4);
        dot.setAttribute("fill", s.colorVar);
        dot.setAttribute("stroke", cssVar('--surface-1'));
        dot.setAttribute("stroke-width", 2);
        svg.appendChild(dot);
        break;
      }
    }
  });

  const crosshair = document.createElementNS(svgNS, "line");
  crosshair.setAttribute("class", "crosshair");
  crosshair.setAttribute("y1", PAD.top); crosshair.setAttribute("y2", CH - PAD.bottom);
  crosshair.setAttribute("visibility", "hidden");
  svg.appendChild(crosshair);

  const hit = document.createElementNS(svgNS, "rect");
  hit.setAttribute("class", "hit-rect");
  hit.setAttribute("x", PAD.left); hit.setAttribute("y", PAD.top);
  hit.setAttribute("width", CW - PAD.left - PAD.right);
  hit.setAttribute("height", CH - PAD.top - PAD.bottom);
  svg.appendChild(hit);

  const tooltip = document.getElementById('tooltip');

  function nearestPoint(mx) {
    const targetT = tMin + (mx - PAD.left) / (CW - PAD.left - PAD.right) * tSpan;
    let best = pts[0], bestDist = Infinity;
    pts.forEach(p => {
      const d = Math.abs(p.t.getTime() - targetT);
      if (d < bestDist) { bestDist = d; best = p; }
    });
    return best;
  }

  hit.addEventListener('pointermove', (ev) => {
    const rect = svg.getBoundingClientRect();
    const mx = (ev.clientX - rect.left) / rect.width * CW;
    const p = nearestPoint(mx);
    const px = x(p.t.getTime());
    crosshair.setAttribute("x1", px); crosshair.setAttribute("x2", px);
    crosshair.setAttribute("visibility", "visible");

    tooltip.style.display = 'block';
    tooltip.style.left = (ev.clientX + 14) + 'px';
    tooltip.style.top = (ev.clientY + 14) + 'px';
    tooltip.innerHTML = '';
    const timeEl = document.createElement('div');
    timeEl.className = 't-time';
    timeEl.textContent = p.t.toLocaleString('es-AR', {weekday:'short', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
    tooltip.appendChild(timeEl);
    activeSeries.forEach(s => {
      const row = document.createElement('div'); row.className = 't-row';
      const key = document.createElement('span'); key.className = 't-key'; key.style.background = s.colorVar;
      const valEl = document.createElement('span'); valEl.className = 't-val'; valEl.textContent = fmtMoney(p[s.key]);
      const nameEl = document.createElement('span'); nameEl.className = 't-name'; nameEl.textContent = s.name;
      row.appendChild(key); row.appendChild(valEl); row.appendChild(nameEl);
      tooltip.appendChild(row);
    });
  });
  hit.addEventListener('pointerleave', () => {
    tooltip.style.display = 'none';
    crosshair.setAttribute("visibility", "hidden");
  });

  container.appendChild(svg);
  return container;
}

function renderCharts(data) {
  const grid = document.getElementById('chart-grid');
  grid.innerHTML = "";
  const routes = filters.routesMode === "all" ? getAllRoutes() : getAllRoutes().filter(r => filters.routesMode.has(r));
  routes.forEach(routeKey => {
    const card = document.createElement('div');
    card.className = 'chart-card';
    const meta = routeMeta(routeKey);
    const h3 = document.createElement('h3'); h3.textContent = meta.short;
    const note = document.createElement('p'); note.className = 'chart-note'; note.textContent = meta.tag;
    card.appendChild(h3); card.appendChild(note);
    card.appendChild(buildLineChart(routeKey, data));
    grid.appendChild(card);
  });
}

// ============================================================
// Diverging bar chart: gap % by route
// ============================================================
function computeGaps(data) {
  const routes = filters.routesMode === "all" ? getAllRoutes() : getAllRoutes().filter(r => filters.routesMode.has(r));
  return routes.map(routeKey => {
    const rows = data.filter(d => d.ruta === routeKey && d.cabify !== null && d.uber !== null);
    const gaps = rows.map(r => (r.cabify - r.uber) / r.uber * 100);
    const mean = gaps.length ? gaps.reduce((a,b) => a+b, 0) / gaps.length : null;
    return {routeKey, mean, n: gaps.length};
  }).filter(g => g.mean !== null);
}

function renderBarChart(data) {
  const container = document.getElementById('bar-chart');
  container.innerHTML = "";
  const gaps = computeGaps(data);
  if (!gaps.length) {
    const empty = document.createElement('p');
    empty.className = 'empty-note';
    empty.textContent = 'Sin datos suficientes con los filtros actuales.';
    container.appendChild(empty);
    return;
  }
  const maxAbs = Math.max(...gaps.map(g => Math.abs(g.mean))) * 1.25 || 1;
  const W = 900, rowH = 56, PADL = 230, PADR = 70, H = rowH * gaps.length + 20;
  const midX = PADL + (W - PADL - PADR) / 2;
  const scale = v => (W - PADL - PADR) / 2 / maxAbs * v;

  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("class", "chart");

  const zero = document.createElementNS(svgNS, "line");
  zero.setAttribute("x1", midX); zero.setAttribute("x2", midX);
  zero.setAttribute("y1", 4); zero.setAttribute("y2", H - 4);
  zero.setAttribute("stroke", cssVar('--axis'));
  zero.setAttribute("stroke-width", 1);
  svg.appendChild(zero);

  gaps.forEach((g, i) => {
    const cy = i * rowH + rowH/2 + 10;
    const barW = Math.abs(scale(g.mean));
    const barX = g.mean < 0 ? midX - barW : midX;
    const colorVar = g.mean < 0 ? 'var(--div-neg)' : 'var(--div-pos)';

    const label = document.createElementNS(svgNS, "text");
    label.setAttribute("x", PADL - 12); label.setAttribute("y", cy - 6);
    label.setAttribute("text-anchor", "end");
    label.setAttribute("class", "axis-text");
    label.setAttribute("fill", cssVar('--text-primary'));
    label.setAttribute("font-size", "12");
    label.textContent = routeMeta(g.routeKey).short;
    svg.appendChild(label);

    const tag = document.createElementNS(svgNS, "text");
    tag.setAttribute("x", PADL - 12); tag.setAttribute("y", cy + 10);
    tag.setAttribute("text-anchor", "end");
    tag.setAttribute("class", "axis-text");
    tag.textContent = routeMeta(g.routeKey).tag;
    svg.appendChild(tag);

    const bar = document.createElementNS(svgNS, "rect");
    bar.setAttribute("x", barX); bar.setAttribute("y", cy - 12);
    bar.setAttribute("width", Math.max(barW, 1)); bar.setAttribute("height", 24);
    bar.setAttribute("rx", 4);
    bar.setAttribute("fill", colorVar);
    svg.appendChild(bar);

    const val = document.createElementNS(svgNS, "text");
    val.setAttribute("class", "end-label");
    val.setAttribute("y", cy + 4);
    val.setAttribute("fill", cssVar('--text-primary'));
    if (g.mean < 0) { val.setAttribute("x", barX - 8); val.setAttribute("text-anchor", "end"); }
    else { val.setAttribute("x", barX + barW + 8); val.setAttribute("text-anchor", "start"); }
    val.textContent = (g.mean > 0 ? "+" : "") + g.mean.toFixed(1) + "%";
    svg.appendChild(val);
  });

  container.appendChild(svg);
}

// ============================================================
// Table view
// ============================================================
function renderTable(data) {
  const table = document.getElementById('data-table');
  table.innerHTML = "";
  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  ["Fecha", "Ruta", "Cabify", "Uber", "DiDi", "Gap %"].forEach(h => {
    const th = document.createElement('th'); th.textContent = h; headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  const sorted = [...data].sort((a,b) => b.t - a.t).slice(0, 500);
  sorted.forEach(d => {
    const tr = document.createElement('tr');
    const cells = [
      d.t.toLocaleString('es-AR'),
      routeMeta(d.ruta).short,
      fmtMoney(d.cabify),
      fmtMoney(d.uber),
      fmtMoney(d.didi),
      (d.cabify !== null && d.uber !== null) ? ((d.cabify - d.uber)/d.uber*100).toFixed(1) + '%' : '—',
    ];
    cells.forEach(c => { const td = document.createElement('td'); td.textContent = c; tr.appendChild(td); });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  if (data.length > 500) {
    const note = document.createElement('caption');
    note.style.captionSide = 'bottom'; note.style.fontSize = '0.75rem'; note.style.color = 'var(--text-muted)'; note.style.padding = '6px 0';
    note.textContent = `Mostrando las 500 filas más recientes de ${data.length}.`;
    table.appendChild(note);
  }
}

// ============================================================
// Caveat / source note
// ============================================================
function renderCaveatAndSource() {
  const days = new Set(RAW.map(d => d.t.toDateString())).size;
  const minT = RAW.length ? new Date(Math.min(...RAW.map(d=>d.t.getTime()))) : null;
  const maxT = RAW.length ? new Date(Math.max(...RAW.map(d=>d.t.getTime()))) : null;
  const caveat = document.getElementById('caveat-box');
  caveat.innerHTML = "";
  const b = document.createElement('b'); b.textContent = 'Ventana de datos: ';
  caveat.appendChild(b);
  caveat.appendChild(document.createTextNode(
    minT && maxT ? `${minT.toLocaleString('es-AR')} → ${maxT.toLocaleString('es-AR')} (${RAW.length} cotizaciones).` : 'sin datos.'
  ));
  if (days <= 2) {
    caveat.appendChild(document.createElement('br'));
    const b2 = document.createElement('b'); b2.textContent = 'Todavía no se pueden comparar';
    caveat.appendChild(b2);
    caveat.appendChild(document.createTextNode(' día de semana, principio/mediados de mes ni semanas calendario con tan poca historia.'));
  }
  document.getElementById('source-note').textContent =
    `Fuente: planilla "Cotizaciones" (Google Sheets). ${dataMode === 'live' ? 'Conectado en vivo a tu Google Drive.' : 'Mostrando snapshot embebido.'}`;
}

// ============================================================
function renderAll() {
  const data = getFiltered();
  renderCaveatAndSource();
  renderStats(data);
  renderLegend(data);
  renderCharts(data);
  renderBarChart(data);

// ============================================================
// Live status UI
// ============================================================
function renderLiveStatus() {
  const dot = document.getElementById('live-dot');
  const label = document.getElementById('live-label');
  const btn = document.getElementById('live-refresh-btn');
  const wrap = document.getElementById('content-wrap');

  dot.className = 'live-dot';
  wrap.classList.remove('stale');

  if (dataMode === 'live') {
    dot.classList.add('on');
    label.textContent = `En vivo · actualizado ${relTime(lastUpdated)}`;
    btn.hidden = false;
  } else if (dataMode === 'refreshing') {
    dot.classList.add('warn');
    label.textContent = 'Actualizando…';
    btn.hidden = false;
    wrap.classList.add('stale');
  } else if (dataMode === 'stale') {
    dot.classList.add('warn');
    label.textContent = `Reintentando · último dato ${relTime(lastUpdated)}`;
    btn.hidden = false;
  } else if (dataMode === 'error') {
    dot.classList.add('err');
    label.textContent = 'Sin conexión con Drive';
    btn.hidden = false;
  } else {
    dot.classList.add('off');
    label.textContent = 'Estático (snapshot embebido)';
    btn.hidden = true;
  }
}

function showBanner(kind, text) {
  const el = document.getElementById('error-banner');
  el.className = 'banner ' + kind;
  el.textContent = text;
  el.hidden = false;
}
function hideBanner() {
  document.getElementById('error-banner').hidden = true;
}

// ============================================================
// Live data via window.claude.mcp (Google Drive connector)
// ============================================================
function decodeB64Utf8(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

function extractPayload(result) {
  let p = result.payload;
  if (typeof p === 'string') {
    try { p = JSON.parse(p); } catch (e) { /* leave as string */ }
  }
  return p;
}

function applyCsvText(csvText, storedAt) {
  const records = csvToRecords(csvText);
  if (records.length) RAW = records;
  lastUpdated = storedAt ?? Date.now();
  dataMode = 'live';
  hideBanner();
  renderLiveStatus();
  buildRouteChips();
  renderAll();
}

function handleMcpError(err) {
  switch (err.code) {
    case 'needs_reauth':
    case 'server_not_connected':
    case 'selection_required':
    case 'not_in_manifest':
    case 'blocked_by_policy':
    case 'approval_required':
      dataMode = 'error';
      renderLiveStatus();
      showBanner('err', 'Se perdió la conexión con Google Drive (reconectá el conector "Google Drive" en claude.ai → Configuración → Conectores). Mientras tanto, se muestra el último dato disponible.');
      break;
    case 'server_unavailable':
    case 'rate_limited':
    case 'upstream_error':
    case 'tool_error':
      dataMode = 'stale';
      renderLiveStatus();
      showBanner('warn', 'Google Drive no respondió; reintentando automáticamente. Se muestra el último dato conocido.');
      break;
    case 'not_granted':
    case 'capability_disabled':
    case 'capability_removed':
    default:
      dataMode = 'static';
      renderLiveStatus();
      break;
  }
}

async function initLive() {
  const btn = document.getElementById('live-refresh-btn');
  if (!window.claude || !window.claude.mcp) {
    dataMode = 'static';
    renderLiveStatus();
    btn.hidden = true;
    return;
  }

  const EXPECTED_TOOL = 'download_file_content';
  let toolName = EXPECTED_TOOL;

  // Self-diagnose the exact tool name/availability before subscribing —
  // this integration wasn't hand-verified through a live browser call,
  // so confirm against listTools() rather than assume the name is right.
  try {
    const listed = await window.claude.mcp.listTools();
    const gdrive = listed.servers.find(s => s.server === 'Google Drive');
    if (!gdrive) {
      dataMode = 'error';
      renderLiveStatus();
      showBanner('err', 'No se encontró el conector "Google Drive" conectado a tu cuenta. Conectalo en claude.ai → Configuración → Conectores para ver datos en vivo.');
      return;
    }
    const match = gdrive.tools.find(t => t.name === EXPECTED_TOOL);
    if (!match) {
      dataMode = 'error';
      renderLiveStatus();
      const available = gdrive.tools.map(t => t.name).join(', ') || '(ninguna)';
      showBanner('err', `El conector Google Drive no expone "${EXPECTED_TOOL}" como se esperaba. Herramientas disponibles: ${available}. Avisale a quien mantiene este dashboard para ajustarlo.`);
      return;
    }
  } catch (e) {
    // listTools itself failed (older shell, transient issue) — fall through
    // and let watchTool surface its own error if the assumed name is wrong.
  }

  const input = {fileId: SHEET_ID, exportMimeType: 'text/csv'};

  window.claude.mcp.watchTool('Google Drive', toolName, input, (ev) => {
    if (ev.type === 'data') {
      try {
        const payload = extractPayload(ev.result);
        const csvText = decodeB64Utf8(payload.content);
        const storedAt = ev.result.cache ? ev.result.cache.storedAt : null;
        applyCsvText(csvText, storedAt);
      } catch (e) {
        dataMode = 'error';
        renderLiveStatus();
        showBanner('err', 'No se pudo leer la respuesta de Google Drive. Se muestra el último dato disponible.');
      }
    } else {
      handleMcpError(ev.error);
    }
  }, {refetchInterval: 180000});

  btn.addEventListener('click', async () => {
    dataMode = 'refreshing';
    renderLiveStatus();
    try {
      await window.claude.mcp.invalidate('Google Drive', toolName, input);
    } catch (e) {
      // ignore; watcher will surface the error state if the retry fails
    }
  });

  // keep the "hace X min" label fresh
  setInterval(() => { if (dataMode === 'live' || dataMode === 'stale') renderLiveStatus(); }, 30000);
}

// ============================================================
// Boot
// ============================================================
buildFilterBar();
buildRouteChips();
renderAll();
renderLiveStatus();
initLive();
</script>
